services:
  # 1. Backend Service (FastAPI)
  fastapi:
    build: .
    container_name: maize_backend
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/backend
    restart: unless-stopped

  # 2. Legacy/Data Scientist Service (Streamlit Dashboard)
  streamlit:
    build: .
    container_name: maize_streamlit
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # 3. Modern Client Service (Next.js Application)
  nextjs:
    image: node:20-alpine
    container_name: maize_frontend
    working_dir: /app/frontend
    command: sh -c "npm install && npx next dev --webpack -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/frontend/node_modules
      - /app/frontend/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    restart: unless-stopped
